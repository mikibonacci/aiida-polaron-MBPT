[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiida-polaron-MBPT"
version = "0.1.0"
description = "AiiDA workflow for DFT+U relaxations followed by GW/QP/BSE calculations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Miki Bonacci and Savio Laricchia (CNR)"}]
keywords = ["aiida", "quantum-espresso", "yambo", "gw", "bse", "dft+u"]
classifiers = [
    "Framework :: AiiDA",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiida-core>=2.8,<3",
    "aiida-quantumespresso>=5,<6",
    "aiida-yambo>=3,<4",
    "aiida-pseudo>=1.7.2,<2",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.entry-points."aiida.workflows"]
"polaron_mbpt" = "aiida_polaron_mbpt.workflows.polaron_mbpt:PolaronMBPTWorkChain"

[tool.hatch.build.targets.wheel]
packages = ["src/aiida_polaron_mbpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
